server {
    listen 80;
    server_name localhost;

    root  /var/www/front;
    index index.php index.html index.htm;

    # Backend API (Go) - todas as requisições /api/* vão para o container back.
    # A barra final em proxy_pass remove o prefixo: /api/users -> /users
    # ^~ impede que blocos regex (como \.php$) se sobreponham a este prefixo
    location ^~ /api/ {
        proxy_pass         http://back:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Frontend - arquivos estáticos (HTML, CSS, JS, imagens)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Frontend - arquivos PHP (back/php/*)
    location ~ \.php$ {
        fastcgi_pass  front:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/front$fastcgi_script_name;
        include       fastcgi_params;
    }
}
